name: Ghost Guard Scan

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to scan
        required: true
        type: number
      repo:
        description: Target repository in owner/repo format (e.g. octocat/my-puppet-module)
        required: true
        type: string
    secrets:
      anthropic_api_key:
        description: Anthropic API key for Claude
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout ghost-guard
        uses: actions/checkout@v4
        with:
          repository: danielmackle/ghost-guard
          ref: main

      - name: Run Ghost Guard scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ inputs.repo }}
        run: ruby .github/scripts/ghost_guard_scan.rb
