name: Ghost Guard Scan

on:
  workflow_call:
    secrets:
      anthropic_api_key:
        description: Anthropic API key for Claude
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout ghost-guard
        uses: actions/checkout@v4
        with:
          repository: danielmackle/ghost-guard
          ref: main

      - name: Run Ghost Guard scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: ruby .github/scripts/ghost_guard_scan.rb
